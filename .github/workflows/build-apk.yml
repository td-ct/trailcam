name: Build release APK

on:
  push:
    branches:
      - vibe/hsv-range-sliders-3133ef
      - main
    paths-ignore:
      - 'apk/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p apk
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          VERSION=$(grep -o 'versionName "[^"]*"' app/build.gradle | cut -d'"' -f2)
          cp "$APK" "apk/TrailCam-v${VERSION}-release.apk"
          echo "APK_PATH=apk/TrailCam-v${VERSION}-release.apk" >> "$GITHUB_ENV"

      - name: Commit APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$APK_PATH"
          if git diff --cached --quiet; then
            echo "Keine APK-Änderungen"
            exit 0
          fi
          git commit -m "APK v${GITHUB_REF##*/} [skip ci]"
          git push
